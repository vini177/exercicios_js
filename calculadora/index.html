<!doctype html>
<html lang="en">
  <head>
    <title>Calculadora</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="calculator">
      <input type="text" id="display" readonly>
      <table class="content">
        <tr>
          <td><button onclick="clearDisplay()">C</button></td>
          <td><button onclick="eraseDigit()">←</button></td>
          <td>
            <button onclick="showOnDisplay('/')">/</button>
          </td>
          <td><button onclick="showOnDisplay('*')">*</button></td>
        </tr>
        <tr>
          <td><button onclick="showOnDisplay('7')">7</button></td>
          <td><button onclick="showOnDisplay('8')">8</button></td>
          <td><button onclick="showOnDisplay('9')">9</button></td>
          <td><button onclick="showOnDisplay('-')">-</button></td>
        </tr>
        <tr>
          <td><button onclick="showOnDisplay('4')">4</button></td>
          <td><button onclick="showOnDisplay('5')">5</button></td>
          <td><button onclick="showOnDisplay('6')">6</button></td>
          <td><button onclick="showOnDisplay('+')">+</button></td>
        </tr>
        <tr>
          <td><button onclick="showOnDisplay('1')">1</button></td>
          <td><button onclick="showOnDisplay('2')">2</button></td>
          <td><button onclick="showOnDisplay('3')">3</button></td>
          <td rowspan="2"><button onclick="calc()" class="equal">=</button></td>
        </tr>
        <tr>
          <td colspan="2"><button onclick="showOnDisplay('')" class="zero">0</button></td>
          <td><button onclick="showOnDisplay('.')">.</button></td>
        </tr>
      </table>
